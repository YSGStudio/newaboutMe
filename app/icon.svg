<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="별빛로그">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15105f"/>
      <stop offset="0.52" stop-color="#25127e"/>
      <stop offset="1" stop-color="#40129b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe47b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe47b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="1" stop-color="#ffd75e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- 작은 별가루 — design.md "별 점" 모티프 -->
  <circle cx="96"  cy="104" r="9" fill="#fff2a4" opacity="0.85"/>
  <circle cx="418" cy="140" r="6" fill="#ffffff" opacity="0.55"/>
  <circle cx="404" cy="386" r="8" fill="#fff2a4" opacity="0.7"/>
  <circle cx="112" cy="404" r="5" fill="#ffffff" opacity="0.45"/>

  <!-- ✦ 4각 별 -->
  <path fill="url(#star)" d="M256 84
    C271 194 318 241 428 256
    C318 271 271 318 256 428
    C241 318 194 271 84 256
    C194 241 241 194 256 84 Z"/>
</svg>
