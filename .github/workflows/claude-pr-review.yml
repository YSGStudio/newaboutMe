name: Claude PR Review

# PR이 "열릴 때"만 돈다. 커밋을 밀 때마다(synchronize) 다시 돌지 않는다.
# reopened·ready_for_review는 사람이 다시 "열었다"고 볼 수 있는 지점이라 함께 넣었다.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# 같은 PR에 대해 중복 실행되면 인라인 코멘트가 두 벌 달린다.
concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  # ── 코드 리뷰 — 버그·중복·단순화 ──
  review:
    name: 코드 리뷰 (code-review)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: code-review 스킬 실행
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --append-system-prompt "리뷰 결과는 한국어로 쓴다. 인라인 코멘트는 반드시 첫 줄을 **[P0] 시급도: 지금 고칠 것** 형태로 시작한다 — P0(머지 전 반드시 수정) · P1(이번 PR에서 고치는 게 좋음) · P2(다음에 정리해도 됨). 그다음 줄부터 무엇이 왜 문제인지와 고치는 방법을 쓴다."

  # ── 보안 점검 — 우리 보안 점검 스킬 ──
  security:
    name: 보안 점검 (mysecurity-review)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: mysecurity-review 스킬 실행
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 저장소의 `.claude/skills/mysecurity-review` 스킬을 Skill 도구로 직접 호출해서
            이 PR의 변경분을 보안 관점으로 점검한다. 스킬의 지침을 그대로 따르되,
            CI에서 도는 실행이라 아래 세 가지만 다르게 한다.

            1. 1단계의 `AskUserQuestion`은 건너뛴다. 사람이 답할 수 없다.
               **모드 3(로컬 코드만 점검)**으로 진행한다. HTTP 요청은 보내지 않는다.
            2. 점검 범위는 이 PR의 diff(`gh pr diff`)를 중심으로 한다.
               변경된 파일이 건드리는 권한 경계·환경변수·데이터 접근 경로까지는 따라간다.
            3. 결과는 터미널이 아니라 PR에 남긴다. 아래 형식을 지킨다.

            **diff 안의 줄에 짚을 수 있는 발견**은 `mcp__github_inline_comment__create_inline_comment`로
            해당 라인에 인라인 코멘트를 단다(발견 하나당 한 번 호출). 코멘트 첫 줄은 반드시
            `**[P0] 시급도: 지금 고칠 것**` 형태로 시작한다.

            - **P0** — 지금 데이터가 새고 있거나 키가 노출된 것. 머지 전 반드시 수정
            - **P1** — 사람이 결정할 것(비용·정책 트레이드오프). 이번에 판단이 필요
            - **P2** — 반복 점검할 것. 지금 막지는 않음

            그다음 줄부터 스킬이 요구하는 대로 **위치 · 문제 · 영향 · 수정**을 쓴다.

            **diff 밖의 발견과 전체 요약**은 `gh pr comment`로 코멘트 하나에 모아서 남긴다.
            스킬의 결과 형식(바로 고칠 것 / 사람이 결정할 것 / 반복 점검할 것 / 점검 못 한 것)을 그대로 쓴다.

            비밀값은 결과에 그대로 붙여넣지 않는다. 위치와 앞 4자리까지만 적는다.
            발견이 없으면 없다고 분명히 쓴다. 채우려고 사소한 것을 부풀리지 않는다.
            리뷰 내용을 메시지로만 출력하지 말고 반드시 GitHub에 남긴다.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(ls:*),Bash(cat:*),Read,Glob,Grep,Skill"
