<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별빛보드 재구성 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5fb;color:#20243b;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.top{height:68px;background:#fff;border-bottom:1px solid #e4e6f1;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{font-size:20px;font-weight:850;letter-spacing:-.04em}.logo{display:inline-grid;place-items:center;width:34px;height:34px;background:#5b43c3;color:white;border-radius:10px;margin-right:10px}.role,.tag{display:inline-block;background:#ede9ff;color:#5035ae;padding:5px 11px;border-radius:100px;font-size:13px;font-weight:700}.main{max-width:1440px;margin:auto;padding:30px 5vw 40px}.crumb,.muted,small{color:#5f657e}.crumb{display:block;margin-bottom:18px}.hero{background:linear-gradient(115deg,#29234e,#473784 74%,#6854ad);color:white;padding:29px 34px;border-radius:22px;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;border:1px solid #ffffff35;border-radius:50%;width:500px;height:140px;right:-70px;top:5px;transform:rotate(-21deg);pointer-events:none}.hero p,.hero small{color:#e5defa}.hero .btn{position:relative;z-index:1;background:#fff;color:#3b2989}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1,h2,h3,p{margin:0}h1{font-size:35px;line-height:1.22;letter-spacing:-.045em}h2{font-size:22px;letter-spacing:-.03em}h3{font-size:16px}p{margin-top:8px}.btn{display:inline-block;border:1px solid #dedfee;border-radius:10px;background:white;padding:9px 14px;font-weight:720;text-align:center}.primary{background:#5440b8;color:white;border-color:#5440b8}.tools{display:flex;gap:8px;flex-wrap:wrap}.sheet,.tile,.side{background:#fff;border:1px solid #e1e3ef;border-radius:17px;padding:20px}.tile{display:block;box-shadow:0 3px 12px #26215508}.sheet+.sheet{margin-top:12px}.grid{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px}.split{display:grid;gap:20px;grid-template-columns:220px minmax(0,1fr)}.split>section{min-width:0}.split>.side{align-self:start}.side strong{display:block;margin-bottom:12px}.side a{display:block;border-radius:9px;padding:9px 10px;margin:3px 0}.active{background:#ede9ff;color:#48319c;font-weight:800}.space{margin-top:18px}.line{padding:14px 0;border-bottom:1px solid #ececf5}.line:last-child{border-bottom:0}.number{font-size:24px;font-weight:800}.lane{padding:13px;background:#ebeaf5;border:1px solid #e1deeb;border-radius:15px;min-width:0}.lane:nth-child(2){background:#e9eef9}.lane:nth-child(3){background:#e6f1ec}.lane .tile{margin-top:12px;padding:15px;border-radius:12px}.mine{border:2px solid #a38719}.art{height:65px;border-radius:10px;background:linear-gradient(135deg,#8d7be6,#dad3fb);display:grid;place-items:center;color:#342373;font-size:26px;margin-bottom:14px}.tile:nth-child(2) .art{background:linear-gradient(140deg,#9eb9ed,#e6edff)}.tile:nth-child(3) .art{background:linear-gradient(140deg,#96cbb8,#e2f4ed)}.hint{background:#eeebff;color:#443386;padding:13px 15px;border-radius:10px}.warning{background:#fff3d3;color:#6f500b}.field{display:grid;gap:5px;margin:12px 0;font-weight:700}.field :is(input,textarea,select){border:1px solid #dadbed;border-radius:9px;padding:10px;background:#fbfbff;width:100%;color:inherit}.field textarea{min-height:90px}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}.status{color:#176544;background:#def3e8}.foot{border-top:1px solid #e4e6f1;margin-top:28px;padding-top:14px;display:flex;gap:10px;flex-wrap:wrap;font-size:13px}.foot a{padding:5px 8px;border-radius:8px}.rule{border:1px solid #e4e1f2;border-radius:11px;padding:12px;margin-top:8px}.review{background:#fffaea;border-color:#e8d890}.preview-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:850px){.split{grid-template-columns:1fr}.side{padding:12px}.side a{display:inline-block}.grid{grid-template-columns:1fr}.board .grid{display:flex;overflow:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.board .lane{min-width:min(79vw,300px);scroll-snap-align:start}.hero{padding:22px}.hero:after{display:none}h1{font-size:27px}.main{padding:20px 4vw}.preview-grid{grid-template-columns:1fr}.evaluation-form{grid-column:auto!important}}
</style>
<header class="top"><a class="brand" href="?"><span class="logo">✦</span>별빛보드</a><span class="role" id="role"></span></header><main class="main" id="main"></main>
<script>
const labels={projects:'프로젝트 목록',teacher:'교사 작업장',student:'학생 작업장',card:'카드 읽기·쓰기',settings:'작업장 설정',students:'학생별 현황',evaluate:'교사 평가',review:'내 평가·친구 평가',criteria:'평가 기준 관리',evidence:'배움성찰 연동',empty:'빈 프로젝트'};
const params=new URLSearchParams(location.search), view=params.get('view')||'projects', student=['student','review'].includes(view)||params.get('role')==='student';
const button=(label,target,primary=false)=>'<a class="btn '+(primary?'primary':'')+'" href="?view='+target+'">'+label+'</a>';
const sheet=(body,cls='')=>'<div class="sheet '+cls+'">'+body+'</div>';
const grid=(items)=>'<div class="grid">'+items.join('')+'</div>';
const tag=(s,c='')=>'<span class="tag '+c+'">'+s+'</span>';
const row=(a,b)=>'<div class="row">'+a+b+'</div>';
const heading=(title,sub='',actions='')=>row('<div><h1>'+title+'</h1>'+(sub?'<p class="muted">'+sub+'</p>':'')+'</div>','<div class="tools">'+actions+'</div>');
const field=(name,value='',type='input')=>'<label class="field">'+name+(type==='textarea'?'<textarea>'+value+'</textarea>':'<input value="'+value+'">')+'</label>';
const nav=(s)=>'<aside class="side"><strong>우리 동네 생태 지도</strong>'+[['teacher','프로젝트 작업장'],['teacher','현장 관찰 기록'],['teacher','↳ 우리 모둠 자료'],['teacher','발표 준비'],['settings','작업장 설정'],['students','학생별 현황']].filter(([k])=>!student||k==='teacher').map(([k,l],i)=>'<a class="'+((s===k&&(k!=='teacher'||i===1))?'active':'')+'" href="?view='+(student?'student':k)+'">'+l+'</a>').join('')+'</aside>';
const split=(s,body)=>'<div class="split">'+nav(s)+'<section>'+body+'</section></div>';
const cards=[['김하늘','학교 뒤뜰의 달팽이','비가 그친 뒤 잎 아래에서 달팽이를 발견했어요.','사진 2장'],['이서윤','운동장 옆의 민들레','같은 곳에서 일주일 간격으로 찍은 사진을 비교했어요.','사진 1장'],['박도윤','학교 주변 관찰 위치','모둠이 다녀온 장소를 지도에 표시했어요.','자료 링크']];
const board=()=>split('teacher','<div class="board">'+heading('현장 관찰 기록','관찰한 생물과 발견 장소를 기록해요.',student?button('내 평가','review')+button('＋ 내 카드 쓰기','card&role=student&mode=write',true):button('학생별 현황','students')+button('설정','settings')+button('＋ 카드 쓰기','card&mode=write',true))+'<p class="hint '+(student?'':'warning')+'">'+(student?'내 섹션이에요. 사진이나 자료를 카드에 첨부할 수 있어요.':'학생에게 다른 학생의 카드는 개수만 표시됩니다.　 <a href="?view=settings&tab=가리기"><b>공개 범위 확인 ↗</b></a>')+'</p>'+grid(cards.map(([name,title,body,files],i)=>'<div class="lane">'+row('<h3>'+name+(student&&i===0?' · 나':'')+'</h3>',tag('1개'))+(student&&i>0?'<p class="rule">카드 1개 · 내용 비공개</p>':'<a href="?view=card'+(student?'&role=student':'')+'" class="tile '+(student?'mine':'')+'"><h3>'+title+'</h3><p class="muted">'+body+'</p><p><small>'+files+'</small></p></a>')+'</div>'))+'</div>');
const tab=params.get('tab')||'일반', tabs=['일반','열','카드 형식','가리기','권한','개인 보드','평가 기준'];
const settings={
'일반':field('작업장 이름','현장 관찰 기록')+field('상위 작업장','최상위')+field('표시 순서','2번째'),
'열':'<h3>섹션 구성</h3><p class="muted">섹션을 추가하거나 순서를 바꿉니다.</p>'+cards.map(([n])=>'<div class="line">⠿　'+n+'</div>').join('')+button('＋ 섹션 추가','settings&tab=열'),
'카드 형식':'<h3>카드에 표시할 항목</h3>'+field('기본 항목','제목, 내용')+'<label><input type="checkbox" checked> 첨부 허용</label>',
'가리기':'<h3>학생에게 허용할 공개 범위</h3><p class="muted">다른 학생의 카드에 적용됩니다.</p>'+['모두 보기','숨김','개수만 표시','익명'].map(x=>'<label class="line" style="display:block"><input name="privacy" type="radio" '+(x==='개수만 표시'?'checked':'')+'> '+x+'</label>').join(''),
'권한':'<h3>학생마다 다른 권한을 줄 수 있어요</h3>'+field('기본 권한','쓰기 허용')+cards.map(([n])=>'<div class="line">'+n+'　<span class="muted">기본 권한 사용</span></div>').join(''),
'개인 보드':'<h3>학생별 개인 보드</h3><p class="muted">학생과 담당 교사만 볼 수 있는 하위 작업장을 만듭니다.</p><p>'+button('개인 보드 만들기','settings&tab=개인+보드')+'</p>',
'평가 기준':'<h3>배움성찰 활동 연결</h3><p class="hint">연결된 활동의 평가 기준을 사용하고 결과를 배움성찰에 함께 저장해요.</p>'+field('연결할 활동','우리 동네 생태 조사')+'<label><input type="checkbox" checked> 친구 평가 사용</label><p>'+button('평가 기준 관리','criteria')+'</p>'
};
const rubric=(read=false)=>['관찰 내용을 구체적으로 기록했어요','사진이나 자료로 관찰 내용을 뒷받침했어요'].map((s,i)=>'<section class="line"><h3>'+s+'</h3>'+[['잘함','관찰한 내용을 근거와 함께 설명해요.'],['보통','관찰한 내용과 관련 자료를 기록해요.'],['노력요함','관찰한 내용이나 자료를 더 보완해요.']].map(([grade,description],j)=>'<div class="rule '+(j===i?'active':'')+'">'+(read?'':'<input type="radio" name="grade'+i+'" '+(j===i?'checked':'')+'> ')+'<b>'+grade+'</b>　'+description+'</div>').join('')+'</section>').join('');
const views={
projects:()=>'<section class="hero">'+row('<div><small>5학년 2반</small><h1>별빛보드 프로젝트</h1><p>수업 자료와 학생 결과물을 작업장별로 모아보세요.</p></div>',student?'':button('＋ 새 프로젝트','projects&mode=create'))+'</section>'+ (params.get('mode')?'<div class="space">'+sheet('<h2>프로젝트 만들기</h2>'+field('프로젝트 이름')+field('목표','','textarea')+field('과목')+field('시작일과 종료일')+button('목록으로','projects')+' '+button('만들기','empty',true))+'</div>':'')+'<div class="row space"><div class="tools">'+button('진행 중 3','projects')+(student?'':button('보관됨','projects&archived=1'))+'</div>'+(student?'':button('평가 기준 관리','criteria'))+'</div>'+grid((params.has('archived')?['지난 학기 독서 기록']:['우리 동네 생태 지도','이야기로 만나는 역사','수학 탐구 노트']).map((title,i)=>'<a class="tile" href="?view='+(student?'student':'teacher')+'"><div class="art" aria-hidden="true">'+['⌖','▤','◇'][i]+'</div>'+tag(['과학','사회','수학'][i])+' <small>'+ (params.has('archived')?'보관됨':'진행 중')+'</small><h2 class="space">'+title+'</h2><p class="muted">11월 12일 – 12월 5일</p><div class="line">작업장 '+[4,3,2][i]+'개　·　카드 '+[18,12,5][i]+'개</div><b>작업장 열기 →</b></a>')),
teacher:board,student:board,
settings:()=>split('settings',heading('작업장 설정','작업장 구조와 학생에게 보이는 범위를 관리해요.',button('작업장 보기','teacher'))+'<div class="space">'+sheet('<div class="tabs">'+tabs.map(t=>'<a class="btn '+(tab===t?'active':'')+'" href="?view=settings&tab='+encodeURIComponent(t)+'">'+t+'</a>').join('')+'</div><h2>현장 관찰 기록</h2>'+(settings[tab]||settings.일반)+'<div class="space">'+button('저장','settings&tab='+encodeURIComponent(tab),true)+'</div>')+'</div>'),
card:()=>{const write=params.get('mode')==='write', mine=student?'&role=student':'';return split('teacher',heading(write?'카드 쓰기':'카드 상세','현장 관찰 기록',button('작업장으로',student?'student':'teacher'))+'<div class="space">'+sheet(write?field('제목')+field('내용','','textarea')+'<p class="hint">사진·PDF·영상 또는 링크를 첨부할 수 있어요.</p><p>'+button('취소',student?'student':'teacher')+' '+button('카드 올리기','card'+mine,true)+'</p>':row('<h2>학교 뒤뜰의 달팽이</h2>',button('수정','card'+mine+'&mode=write'))+'<p class="muted">김하늘 · 11월 25일</p><p>비가 그친 뒤 잎 아래에서 달팽이를 발견했어요. 다음에는 같은 장소를 맑은 날에도 관찰해 보고 싶어요.</p><div class="line"><b>첨부</b><p>관찰 사진 2장　·　현장 기록.pdf</p></div><details class="space"><summary>활동 기록</summary><p>11월 25일 · 김하늘이 카드를 작성했어요.</p></details>')+'</div>')},
students:()=>split('students',heading('학생별 현황','현장 관찰 기록 · 평가 상태와 개인 보드를 확인하세요.')+'<div class="space">'+sheet('<div class="tabs">'+tag('전체 3명')+tag('평가 대기 2명')+tag('평가 완료 1명','status')+'</div>'+cards.map(([n],i)=>'<div class="line">'+row('<div><h3>'+n+'</h3><small>개인 보드 카드 '+[2,1,3][i]+'개</small></div>','<div class="tools">'+tag(i===0?'평가 완료':'평가 대기',i===0?'status':'')+button(i===0?'평가 보기':'평가하기','evaluate&student='+i,i!==0)+'</div>')+'</div>').join(''))+'</div>'),
evaluate:()=>split('students',heading('학생 평가','현장 관찰 기록 · '+cards[Number(params.get('student')||0)%3][0],button('학생별 현황','students'))+'<p class="hint">배움성찰 ‘우리 동네 생태 조사’에 함께 저장돼요.</p>'+grid([sheet('<h2>평가할 결과물</h2><p>학교 뒤뜰의 달팽이</p><p class="muted">개인 보드 카드 2개</p><p>'+button('카드 열기','card')+'</p>'),'<div class="evaluation-form" style="grid-column:span 2">'+sheet('<h2>평가 기준</h2>'+rubric()+field('학생에게 남길 피드백','관찰한 장소와 날씨가 잘 드러나요.','textarea')+button('평가 저장','students',true))+'</div>'])),
review:()=>split('teacher',heading('내 평가','현장 관찰 기록 · 김하늘',button('작업장으로','student'))+'<div class="space">'+sheet(row('<h2>받은 평가</h2>',tag('공개됨','status'))+'<p><b>선생님 한마디</b>　관찰한 장소와 날씨가 잘 드러나요.</p>'+rubric(true)+'<p><b>친구 평가 평균</b>　4.3 / 5</p>','review')+sheet(row('<div><h2>친구 평가</h2><p class="muted">이서윤의 관찰 기록</p></div>',button('평가하기','review&mode=peer'))+(params.get('mode')?'<p><label>관찰 기록에 별점 주기　<select><option>5점</option><option>4점</option><option>3점</option><option>2점</option><option>1점</option></select></label></p>':''))+'</div>'),
criteria:()=>heading('평가 기준 관리','여러 작업장에서 사용할 기준을 만들고 편집해요.',button('배움성찰에서 불러오기','criteria&mode=import')+button('＋ 새 기준','criteria&mode=create',true))+'<div class="space">'+sheet('<h2>내 평가 기준</h2>'+['관찰 기록의 구체성','근거 자료 활용'].map((n,i)=>'<div class="line">'+row('<div><h3>'+n+'</h3><small>'+ (i?'미사용':'평가에 사용 중 · 단계 잠김')+'</small></div>',button(i?'편집':'보기','criteria&mode=edit'))+'</div>').join(''))+(params.has('mode')?sheet(params.get('mode')==='import'?'<h2>배움성찰 기준 가져오기</h2>'+field('활동','우리 동네 생태 조사')+button('가져오기','criteria',true):'<h2>평가 기준 편집</h2>'+field('기준 이름','관찰 기록의 구체성')+field('설명')+['잘함','보통','노력요함'].map(g=>field(g,'','textarea')).join('')+button('저장','criteria',true)):'')+'</div>',
evidence:()=>heading('배움성찰 활동','우리 동네 생태 조사 · 결과물')+'<div class="space">'+sheet(row('<h2>연결한 작업장</h2>',button('＋ 작업장 연결','evidence&mode=pick'))+(params.has('mode')?field('연결할 작업장','현장 관찰 기록'):'')+'<p>'+tag('현장 관찰 기록')+'　'+tag('읽기 전용','status')+'</p><div class="line"><h3>현장 관찰 기록</h3><p class="muted">연결된 작업장과 하위 작업장만 표시돼요.</p>'+grid(cards.map(([name,title])=>'<div class="lane"><h3>'+name+'</h3><div class="tile">'+title+'</div></div>'))+'</div><div class="line">↳ 우리 모둠 자료</div>')+sheet(row('<div><h2>평가 연동</h2><p class="muted">별빛보드에서 저장한 평가가 이 활동에도 표시돼요.</p></div>',button('연결 설정','settings&tab=평가+기준')) )+'</div>',
empty:()=>split('teacher',heading('우리 동네 생태 지도','프로젝트가 만들어졌어요.')+'<div class="space">'+sheet('<h2>아직 작업장이 없어요</h2><p class="muted">첫 작업장을 만들면 관찰 기록이나 모둠 자료를 모을 수 있어요.</p><p>'+button('＋ 첫 작업장 만들기','settings',true)+'</p>')+'</div>')
};
